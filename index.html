  // 请假折线图 SVG（手写，单文件离线）
  function leaveTrendChart(trend) {
    var svgWrap = doc.createElement('span');
    if (!trend || trend.length === 0) {
      svgWrap.className = 'trend-empty';
      svgWrap.textContent = '暂无请假记录';
      return svgWrap;
    }
    var W = 280, H = 96, padL = 6, padR = 6, padT = 14, padB = 20;
    var maxC = 1;
    trend.forEach(function (p) { if (p.count > maxC) maxC = p.count; });
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var pts = trend.map(function (p, i) {
      var x = padL + (trend.length === 1 ? innerW / 2 : (innerW * i) / (trend.length - 1));
      var y = padT + innerH - (innerH * (p.count / maxC));
      return { x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10, p: p };
    });
    var poly = pts.map(function (q) { return q.x + ',' + q.y; }).join(' ');
    var dots = pts.map(function (q) {
      return '<circle cx="' + q.x + '" cy="' + q.y + '" r="3" class="trend-point" />' +
        '<text x="' + q.x + '" y="' + (q.y - 8) + '" class="trend-val">' + q.p.count + '</text>';
    }).join('');
    var xlabels = pts.map(function (q) {
      return '<text x="' + q.x + '" y="' + (H - 6) + '" class="trend-x">' + String(q.p.date).slice(5) + '</text>';
    }).join('');
    svgWrap.className = 'trend-chart';
    svgWrap.innerHTML =
      '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" preserveAspectRatio="xMidYMid meet">' +
      '<polyline points="' + poly + '" class="trend-line" fill="none" />' +
      dots + xlabels + '</svg>';
    return svgWrap;
  }

  // HTML5 拖拽排序
  function enableCardDrag(cards) {
    var dragId = null;
    Array.prototype.forEach.call(cards.children, function (card) {
      card.setAttribute('draggable', 'true');
      card.addEventListener('dragstart', function () {
        dragId = card.id;
        card.classList.add('dragging');
      });
      card.addEventListener('dragend', function () { card.classList.remove('dragging'); });
      card.addEventListener('dragover', function (e) { e.preventDefault(); });
      card.addEventListener('drop', function (e) {
        e.preventDefault();
        if (!dragId || dragId === card.id) return;
        var from = null, to = null;
        Array.prototype.forEach.call(cards.children, function (c) {
          if (c.id === dragId) from = c;
          if (c.id === card.id) to = c;
        });
        if (!from || !to) return;
        if (from.nextSibling === to) cards.insertBefore(from, to.nextSibling);
        else cards.insertBefore(from, to);
        // 持久化顺序
        var order = Array.prototype.map.call(cards.children, function (c) { return c.id; });
        saveHomeOrder(order);
      });
    });
  }

  // 可编辑单元格：点击变 input/select，失焦或回车保存；class/name 文本、gender/boarding 用下拉
  function editableCell(field, value, studentId, tr, opts) {
    opts = opts || {};
    var td = el('td', { 'data-field': field, text: value });
    var editing = false;
    td.addEventListener('click', function (e) {
      if (editing) return;
      e.stopPropagation();
      editing = true;
      var cur = store.getState().students.filter(function (x) { return x.id === studentId; })[0];
      if (!cur) return;
      var raw = cur[field];
      var input;
      if (opts.select) {
        input = el('select', { 'data-field': field });
        opts.select.forEach(function (opt) {
          input.appendChild(el('option', { value: opt }, [opt]));
        });
        if (opts.emptyLabel) input.appendChild(el('option', { value: '' }, [opts.emptyLabel]));
        input.value = raw || '';
      } else {
        input = el('input', { type: 'text', 'data-field': field, value: raw == null ? '' : String(raw) });
      }
      clear(td);
      td.appendChild(input);
      input.focus();
      function commit() {
        if (!editing) return;
        editing = false;
        var v = input.value;
        var d = {};
        if (opts.select) {
          d[field] = (v === '' && opts.emptyLabel) ? '' : v;
        } else {
          d[field] = v;
        }
        if (field === 'score') {
          var sc = Number(v);
          if (isNaN(sc)) sc = 100;
          d[field] = sc;
        }
        updateStudent(studentId, d);
      }
      input.addEventListener('blur', commit);
      input.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
        if (ev.key === 'Escape') { input.blur(); }
      });
    });
    return td;
  }

    if (/\.(xlsx|xls)$/.test(name) && typeof XLSX !== 'undefined') {
      reader.onload = function () {

          var wb = XLSX.read(reader.result, { type: 'array' });

      };
      reader.readAsArrayBuffer(file);
    } else {
      reader.onload = function () {
        try { previewImport(C.parseCSV(String(reader.result))); }
        catch (err) { if (typeof alert === 'function') alert('CSV 解析失败：' + err.message); }
      };
      reader.readAsText(file);

  function scoreMonthCell(studentId, cat, value) {
    var td = el('td', { 'data-cat': cat, text: String(value || 0) });
    var editing = false;
    td.addEventListener('click', function () {
      if (!isAdmin) return; // 普通模式只读
      if (editing) return;
      editing = true;
      var input = el('input', { type: 'number', 'data-cat': cat, value: String(value || 0) });
      clear(td);
      td.appendChild(input);
      input.focus();
      function commit() {
        if (!editing) return;
        editing = false;
        var v = Number(input.value);
        if (isNaN(v)) v = 0;
        var d = {}; d[cat] = v;
        C.setMonthScore(store.getState().scoreMonthly, studentId, scoreMonth, d);
        store.save();
        renderScoreTable();
      }
      input.addEventListener('blur', commit);
      input.addEventListener('keydown', function (ev) {

        if (ev.key === 'Escape') { input.blur(); }
      });
    });
    return td;
  }

  function recordScore(studentId, info) {
    if (!guardAdmin('记量化流水')) return null;
    var list = store.getState().students;
    var s = null; for (var i = 0; i < list.length; i++) if (list[i].id === studentId) { s = list[i]; break; }
    if (!s) return null;
    var delta = Number(info.delta);
    var after = C.computeAfter(s.score, delta);
    s.score = after;
    var log = { id: C.uid('l'), studentId: studentId, date: (info.date || C.todayStr()), item: info.item || '', delta: delta, reason: info.reason || '', after: after };
    store.getState().scoreLogs.push(log);
    // 同步到按月四类（类别缺省时按正负归类：正→班奖，负→班扣）
    var cat = info.cat;
    if (!cat) cat = delta >= 0 ? 'banJiang' : 'banKou';
    var month = (info.date || C.todayStr()).slice(0, 7);
    var d = {}; d[cat] = Math.abs(delta);
    C.setMonthScore(store.getState().scoreMonthly, studentId, month, d, 'add');
    store.save();
    if (state.current === 'score') renderScoreTable();
    return log;

        el('th', { text: '寝室号' }), el('th', { text: '班级' }), isAdmin ? el('th', { text: '操作' }) : null])])]);
      var tb = el('tbody', {});
      // 同寝室号合并展示（混寝）：按寝室号分组渲染
      var byRoom = {};
      g.items.forEach(function (item) {
        var r = item.d.room;
        if (!byRoom[r]) byRoom[r] = [];
        byRoom[r].push(item);
      });
      Object.keys(byRoom).sort(function (a, b) { return Number(a) - Number(b); }).forEach(function (room) {
        var items = byRoom[room];
        var main = items[0];
        var tr = el('tr', { 'data-idx': main.idx }, [
          el('td', { text: main.d.room }),
          el('td', {}, [
            el('span', { text: items.map(function (it) { return it.d.class; }).join('、') }),
            items.length > 1 ? el('span', { class: 'tag', text: '混寝' }) : null
          ]),
          isAdmin ? el('td', {}, [
            el('span', { class: 'link', onclick: function () { openEditDorm(main.idx); } }, ['改']),
            el('span', { text: '  ' }),
            el('span', { class: 'link', onclick: function () { deleteDorm(main.idx); } }, ['删'])
          ]) : null
        ]);
        tb.appendChild(tr);
      });
      table.appendChild(tb); box.appendChild(table);
    });
  }
  function dormForm(data) {
    data = data || {};
    var room = el('input', { type: 'text', id: 'd-room', value: data.room || '' });
    var cls = el('input', { type: 'text', id: 'd-class', value: data.class || '' });
    var areaSel = el('select', { id: 'd-area' }, C.DORM_AREAS.concat(['']).map(function (a) {
      return el('option', { value: a, selected: (data.area || '') === a ? 'selected' : null }, [a === '' ? '未分区' : a]);
    }));
    return {
      nodes: [
        el('div', { class: 'form-row' }, [el('label', { text: '寝室号' }), room]),
        el('div', { class: 'form-row' }, [el('label', { text: '班级（如 高一4班）' }), cls]),
        el('div', { class: 'form-row' }, [el('label', { text: '区域' }), areaSel])
      ],
      read: function () { var pc = C.parseClass(cls.value); return { room: room.value.trim(), class: pc ? pc.label : cls.value.trim(), area: areaSel.value || '' }; }
    };
  }
  function openAddDorm() {
    if (!guardAdmin('新增对照')) return;
    var f = dormForm();
    openModal('新增对照', f.nodes, function () { var d = f.read(); if (!d.room) { if (typeof alert === 'function') alert('请填写寝室号'); return false; } addDormMap(d); }, '添加');
  }
  function openEditDorm(idx) {
    if (!guardAdmin('编辑对照')) return;
    var d = store.getState().dormMap[idx]; if (!d) return;
    var f = dormForm(d);
    openModal('编辑对照', f.nodes, function () { var nd = f.read(); if (!nd.room) { if (typeof alert === 'function') alert('请填写寝室号'); return false; } updateDormMap(idx, nd); }, '保存');
  }
  function addDormMap(d) { if (!guardAdmin('新增对照')) return; store.getState().dormMap.push({ room: d.room, class: d.class, area: d.area || '' }); store.save(); renderDormList(); return d; }
  function updateDormMap(idx, d) { if (!guardAdmin('编辑对照')) return; var l = store.getState().dormMap; if (l[idx]) { l[idx] = { room: d.room, class: d.class, area: d.area || '' }; store.save(); renderDormList(); } }
  function deleteDorm(idx) { if (!guardAdmin('删除对照')) return; if (typeof confirm === 'function' && !confirm('确定删除该对照？')) return; var s = store.getState(); s.dormMap.splice(idx, 1); store.setState(s); renderDormList(); }
  function importDormMapFromRows(rows) {
    if (!guardAdmin('导入对照表')) return;
    var built = C.buildDormMapFromRows(rows);
    var l = store.getState().dormMap;
    built.forEach(function (b) { l.push(b); });
    store.save(); renderDormList();
    return built.length;
  }
  function onDormFile(e) {
    var file = e.target.files && e.target.files[0]; if (!file) return;
    var name = (file.name || '').toLowerCase(); var reader = new FileReader();
    if (/\.(xlsx|xls)$/.test(name) && typeof XLSX !== 'undefined') {
      reader.onload = function () {
        try { var wb = XLSX.read(reader.result, { type: 'array' }); var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' }); var n = importDormMapFromRows(rows); if (typeof alert === 'function') alert('已导入 ' + n + ' 条对照'); }
        catch (err) { if (typeof alert === 'function') alert('解析失败：' + err.message); }
      };
      reader.readAsArrayBuffer(file);
    } else {
      reader.onload = function () { try { var n = importDormMapFromRows(C.parseCSV(String(reader.result))); if (typeof alert === 'function') alert('已导入 ' + n + ' 条对照'); } catch (err) { if (typeof alert === 'function') alert('解析失败：' + err.message); } };
      reader.readAsText(file);
    }
    e.target.value = '';
  }
  function downloadDormTemplate() { if (!guardAdmin('下载对照模板')) return; downloadText('寝室对照表模板.csv', '\uFEFF寝室号,区域,班级\n428,女寝,高一4班\n502,男寝,高二3班\n211,男寝,高二9班\n', 'text/csv'); }

  function confirmClear() {
    if (typeof confirm === 'function' && !confirm('确定清空全部数据？此操作不可撤销，建议先导出备份。')) return;
    clearAllData();
    if (typeof alert === 'function') alert('数据已清空');
  }
  function clearAllData() { if (!guardAdmin('清空数据')) return; store.clear(); refresh(); }

  function renderSettingsPlaceholderRemoved() {}

  // ---------- 导出 API ----------
  var App = {
    init: init,
    switchTo: switchTo,
    refresh: refresh,
    doExport: doExport,
    doImportText: doImportText,
    importStudentsFromRows: importStudentsFromRows,
    addStudent: addStudent,
    updateStudent: updateStudent,
    deleteStudent: deleteStudent,
    setStudentsFilter: function (f) { Object.assign(studentsFilter, f); renderStudentTable(); },
    addScoreItem: addScoreItem,
    updateScoreItem: updateScoreItem,
    deleteScoreItem: deleteScoreItem,
    addDormMap: addDormMap,
    updateDormMap: updateDormMap,
    deleteDorm: deleteDorm,
    importDormMapFromRows: importDormMapFromRows,
    clearAllData: clearAllData,
    recordScore: recordScore,
    studentScoreLogs: studentScoreLogs,
    setScoreSort: function (v) { scoreSort = v; renderScoreTable(); },
    setScoreFilter: function (f) { Object.assign(scoreFilter, f); renderScoreTable(); },
    recordDiscipline: recordDiscipline,
    studentDisciplineLogs: studentDisciplineLogs,
    saveLeaveRecord: saveLeaveRecord,
    countLeavePersons: countLeavePersons,
    saveReportRecord: saveReportRecord,
    // 云端同步
    pushToCloud: pushToCloud,
    pullFromCloud: pullFromCloud,
    cloudLastPush: cloudLastPush,
    openModal: openModal,
    closeModal: closeModal,
    el: el,
    // 权限相关（供测试与外部调用）
    openAdminGate: openAdminGate,
    logoutAdmin: logoutAdmin,
    setAdminPass: setAdminPass,
    getAdminPass: getAdminPass,
    hasAdminPass: hasAdminPass,
    get isAdmin() { return isAdmin; },
    // 仅供测试：直接设定管理员状态（绕过弹窗）
    setAdminForTest: function (v) { isAdmin = !!v; refresh(); },
    get state() { return state; },
    get store() { return store; },
    get core() { return C; }
  };

  if (typeof window !== 'undefined') window.App = App;
  if (typeof module !== 'undefined' && module.exports) module.exports = App;
})();

</script>
<script>
(function () {
  function boot() { window.App.init(document); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
